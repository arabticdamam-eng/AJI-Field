function xuFlat(name, list, cols, A, opt){ A=A||GRID0; opt=opt||{};

  const c0=clrOf(cols[0]);
  return {name:String(name).replace(/[\\\/?*\[\]:]/g,' ').slice(0,31),color:c0[0],rows,widths,freeze:[noKey?0:1,2],filter:'A2:'+xuCol(nc-1)+(rows.length),hts:{1:32}}; }

const QF_GRACE=3;
const needsQF=o=>{ const e=S.pct['تم التنفيذ']||0; return e>0 && (S.pct[o.cur_stage]??0)>=e; };
const qfMissing=o=>needsQF(o)&&!o.qf_id;
const qfWait=o=>qfMissing(o)?Math.max(0,days(S.B.today,o.exec_date||o.cur_since||S.B.today)):0;
const engOf=o=>o.site_engineer||o.engineer||'(غير محدد)';
function qfEngTable(list){
  const m={}; list.filter(o=>needsQF(o)||o.qf_status).forEach(o=>{ const k=engOf(o); const x=m[k]||(m[k]={need:0,up:0,wait:0,ok:0,rej:0,miss:0,late:0,max:0});
    if(needsQF(o)) x.need++; if(o.qf_id) x.up++; if(o.qf_status==='بانتظار الجودة') x.wait++; if(o.qf_status==='معتمد') x.ok++; if(o.qf_status==='مرفوض') x.rej++;
    if(qfMissing(o)){ x.miss++; const d=qfWait(o); if(d>QF_GRACE) x.late++; x.max=Math.max(x.max,d); } });
  const rows=Object.entries(m).sort((a,b)=>(b[1].late-a[1].late)||(b[1].miss-a[1].miss));
  if(!rows.length) return '<div class="muted">يظهر بعد وصول أوامر العمل لمرحلة «تم التنفيذ».</div>';
  return `<div class="tw" style="max-height:320px"><table><thead><tr><th>المهندس</th><th>منفّذة</th><th>مرفوعة</th><th>بانتظار الجودة</th><th>معتمدة</th><th>مرفوضة</th><th>بلا ملف</th><th>متأخرة +${QF_GRACE} أيام</th><th>أقصى تأخير (يوم)</th></tr></thead><tbody>${rows.map(([k,x])=>`<tr class="go" data-eng="${esc(k)}"><td>${esc(k)}</td><td>${x.need}</td><td>${x.up}</td><td>${x.wait}</td><td>${x.ok}</td><td class="${x.rej?'late':''}">${x.rej}</td><td class="${x.miss?'late':''}">${x.miss}</td><td class="${x.late?'late':''}"><b>${x.late}</b></td><td>${x.max||''}</td></tr>`).join('')}</tbody></table></div>`;
}

function vJourney(){
  let J=(S.B.journey||[]).map(x=>Object.assign({},x)); const names=S.B.people.map(p=>p.name);
  const nrm=x=>String(x==null?'':x).replace(/\s+/g,' ').trim(), OFF=S.B.lists.office||[], OK=OFF.map((x,n)=>'o'+(n+1)), blank=()=>{ const r={kind:'مرحلة',code:'',name:'',pct:'',big:'يدوية'}; OK.forEach(k=>r[k]=''); return r; };
  const PJ=S.B.people.filter(p=>jobSplit(p.job).length).map(p=>({name:p.name,jobs:jobSplit(p.job),offs:String(p.offices||'').split(/[,\u060c]/).map(nrm).filter(Boolean)}));
  // a job written per office («تيم ليدر الدمام / القطيف / الخبر») is offered once as «تيم ليدر المكتب»
  const offJob=v=>{ v=nrm(v); const o=OFF.find(o=>v.length>o.length&&v.endsWith(' '+o)); return o&&!names.includes(v)?v.slice(0,-o.length-1)+' المكتب':v; };
  const rawJobs=[...new Set(jobsAll().concat(...PJ.map(p=>p.jobs)))];
  const jobs=ORDER_ROLES.concat([...new Set(rawJobs.map(offJob))].filter(j=>!ORDER_ROLES.includes(j)).sort((a,b)=>a.localeCompare(b,'ar'))); const isJob=v=>jobs.includes(nrm(v));
  J.forEach(x=>OK.forEach(k=>{ if(x[k]) x[k]=offJob(x[k]); }));
  const jOwn=(v,off)=>{ v=nrm(v); let c=PJ.filter(p=>p.jobs.includes(v)&&p.offs.includes(off)); const m=!c.length&&!rawJobs.includes(v)&&v.match(/^(.+) المكتب$/);
    if(m){ c=PJ.filter(p=>p.jobs.includes(m[1]+' '+off)); if(!c.length) c=PJ.filter(p=>p.jobs.includes(m[1])&&p.offs.includes(off)); }
    c=c.sort((a,b)=>a.offs.length-b.offs.length)[0]; return c?c.name:''; };
  const hint=(v,n)=>!isJob(v)?'':ORDER_ROLES.includes(nrm(v))?'← من بيانات الأمر':(jOwn(v,OFF[n])?'← '+esc(jOwn(v,OFF[n])):'<span style="color:var(--dan)">لا أحد بهذا المسمى في '+OFF[n]+'</span>');
  $('#usub').innerHTML=`<div class="card" style="margin-bottom:10px;line-height:1.9"><b>رحلة أمر العمل</b> — الخطوات بالترتيب من الأولى إلى الأخيرة. استخدم ▲ و▼ لتقديم الخطوة أو تأخيرها، و«＋» لإضافة خطوة بعدها.
     <div class="muted">«إجراء»: خطوة لها رمز في أولاب، وهي نفسها مرحلة في جدول الإسنادات (الإجراء ومرحلته خطوة واحدة). «مرحلة»: خطوة يدوية لا رمز لها في أولاب. «سلة»: الجهة الحالية في أولاب.
     أولاب هو الكلمة الفصل: عند استيراده تتغير «المرحلة الحالية» إلى خطوة آخر إجراء، تقدماً أو رجوعاً، وأي مرحلة ليست في الرحلة تُستبدل. المرحلة اليدوية الأبعد في الترتيب من إجراء أولاب تبقى (تقدّم ميداني لم يصل بعدُ إلى أولاب) حتى يتجاوزها إجراء لاحق. الإجراءان 165 و162 (إرجاع المواد) جانبيان لا يغيّران المرحلة. اسم كل إجراء يُؤخذ من أولاب بتهجئته عند الاستيراد.
     خطوة الأمر: سلته إن كان في سلة، وإلا فالأبعد في الترتيب بين إجرائه ومرحلته. منها يُؤخذ المسؤول الحالي (حسب مكتب الأمر) ونسبة الإنجاز في التقرير الشهري. الخانة الفارغة تُترك للخطوة التي بعدها في الأولوية.
     خانة المسؤول تقبل اسم موظف أو وظيفة (الوظائف أعلى القائمة ثم الأسماء). عند اختيار وظيفة مثل «مسؤول المكتب» تُكتب لكل المكاتب، ويُحدَّد صاحبها في كل مكتب تلقائياً من «الوظائف» و«المكاتب» في المستخدمين، ويتغير تلقائياً إذا تغيّر صاحبها. «مهندس الموقع» و«المهندس المسند» يُؤخذان من بيانات الأمر نفسه. ملف الجودة لا يغيّر المرحلة أبداً، وأولاب يبقى الكلمة الفصل فيها: إذا رفض مهندس الجودة جزءاً من الملف أو الملف كله، يعود الجزء المرفوض إلى المهندس الذي رفعه ويصير هو «المسؤول الحالي» (سبب المسؤولية: «ملف جودة مرفوض») ويظهر له في «مهامي». إذا رُفضت أجزاء لعدة مهندسين يظهر الأمر لهم جميعاً، والمسؤول آخرهم، وينتقل إلى من بقي عنده جزء مرفوض. عند إعادة رفع كل الأجزاء المرفوضة يعود المسؤول إلى ما تحدده الرحلة. إذا أُسند الأمر في الجدول اليومي لأكثر من مهندس، فملف الجودة مسؤولية أول مهندس أُسند إليه، وكلهم يضيفون الصور ويعبّئون النماذج.
     «المشاريع الكبيرة» (أكبر من 50,000): «يدوية» تعني أن نسبة المشروع تُكتب يدوياً في التقرير، و«تلقائية» تعني أنها تؤخذ من هذه الخطوة.
     <b>قاعدة:</b> كل مرحلة يدوية باسمها رمز إجراء أولاب (مثل «تم اجراء 211») تُحذف عند الحفظ ويُعتمد الإجراء بديلاً عنها: إن وُجد الإجراء بالرمز نفسه تُدمج فيه (وتُنقل أوامرها إليه)، وإلا تتحول هي إلى إجراء بذلك الرمز.</div></div>
   <div class="bar"><button class="pri" id="jsave">حفظ الرحلة</button><button id="jadd">+ خطوة في الآخر</button><span id="jmsg" class="muted"></span><span class="sp"></span><button id="japply">تطبيق الرحلة على الأوامر الآن</button></div>

const isCancelled=o=>/ملغ/.test(String(o.cur_stage||''))||/ملغ/.test(String(o.stage||''))||/ملغ/.test(String(o.oracle||''));
function buildReport(maint,month,share,flt,offs){ const RP_SHARE=(+share>0?+share:60)/100;
  const end=month?month+'-31':'9999', upTo=o=>!o.assign_date||String(o.assign_date).slice(0,10)<=end; const ORD=S.orders.concat(S.archO||[]).filter(o=>!isCancelled(o)&&(!flt||flt(o)));
  // orders left out of the figures, counted per office so the difference from the tab's own count is never silent (the owner, 31/10)
  const bad=[], noCost=[], late=[], skip={};
  const sites=rpSites().filter(([en,ar])=>!offs||offs.includes(ar)).map(([en,ar])=>{ const sk=skip[ar]={noCost:0,bad:0,late:0};
    const all=ORD.filter(o=>{ if(o.office!==ar) return false;
      if(o.cost===''||o.cost==null||isNaN(+o.cost)){ noCost.push(o.wo); sk.noCost++; return false; }
      if(!upTo(o)){ late.push(o.wo); sk.late++; return false; }
      if(+o.cost<=0){ bad.push(o.wo); sk.bad++; return false; } return true; }); const small=all.filter(o=>+o.cost<=50000), big=all.filter(o=>+o.cost>50000);
    sk.small=small.length; sk.big=big.length; sk.total=sk.small+sk.big+sk.noCost+sk.bad+sk.late;
    const c=small.reduce((s,o)=>s+(+o.cost),0), p=small.length?small.reduce((s,o)=>s+jPct(o),0)/small.length/100:0;
    const rows=[{label:'Metering Unit ('+small.length+')',pdc:r2(c),aji:r2(c*RP_SHARE),pct:Math.round(p*10000)/10000,sar:r2(c*RP_SHARE*p)}].concat(big.map(o=>{ const pc=bigPct(o)/100;
      return {wo:o.wo,key:o.key,pdc:r2(+o.cost),aji:r2(+o.cost*RP_SHARE),pct:pc,sar:r2(+o.cost*RP_SHARE*pc),contractor:o.contractor,office:o.office,manual:bigManual(o)?1:0}; }));
    const t=k=>r2(rows.reduce((s,x)=>s+x[k],0)); return {en,ar,rows,skip:sk,tot:{pdc:t('pdc'),aji:t('aji'),sar:t('sar')}}; });
  const mp=(+maint.pct||0)/100, m={n:maint.n,aji:r2(maint.sum),pct:mp,sar:r2(maint.sum*mp)};
  const g=k=>r2(sites.reduce((x,y)=>x+y.tot[k],0)+(k==='pdc'?0:m[k])), aji=g('aji'), sar=g('sar');
  return {sites,maint:m,cum:{pdc:g('pdc'),aji,sar,pct:aji?Math.round(sar/aji*10000)/10000:0},month:month||'',made:S.B.today,share:Math.round(RP_SHARE*10000)/100,bad,noCost,late,skip};
}

  const list=q=>vals.filter(v=>!q||v.includes(q)).map(v=>`<label><input type="checkbox" data-cv="${esc(v)}" ${chosen.has(v)?'checked':''}> <span>${esc(v)}</span> <span class="muted">(${cnt[v]})</span></label>`).join('')||'<div class="muted">لا نتائج</div>';

  m.querySelector('#cfn').onclick=()=>{ vals.filter(v=>!q.value||v.includes(q.value.trim())).forEach(v=>chosen.delete(v)); m.querySelector('#cfl').innerHTML=list(q.value.trim()); wireL(); };
  const done=v=>{ m.remove(); document.removeEventListener('mousedown',out); if(v!==undefined){ if(v&&v.length&&v.length<vals.length) F.cf[k]=v; else delete F.cf[k]; F.lim=0; redraw(); } };

  const TN={cons:['الإنشاءات',tc],maint:['الصيانة والطوارئ',tm],cinv:['مراجعة فواتير المقاول',ti],po:['أوامر الشراء والاعتمادات',tc],cover:['كفر الفاتورة',tm]};
  const top=`<div class="bar whtabs">${SUBS.map(k=>`<a data-mts="${k}" class="${sub===k?'on':''}" style="--tc:${TN[k][1][0]};--tt:${TN[k][1][1]}">${TN[k][0]}</a>`).join('')}</div>`;
  const wireTop=()=>document.querySelectorAll('[data-mts]').forEach(a=>a.onclick=()=>{ S.mtSub=a.dataset.mts; vMatching(); });
  $('#main').innerHTML=top+'<div class="loading">جارٍ تحميل المطابقة والصرف…</div>'; wireTop();
  // «أوامر الشراء» adds up the matching records, so it needs them loaded as well as its own stored rows
  const load=sub==='cinv'?ciLoad():sub==='po'?Promise.all([mrLoad(),poLoad()]):sub==='cover'?Promise.all([mrLoad(),cvLoad()]):mrLoad();
  load.then(()=>{ if(S.view!=='matching') return; sub==='cinv'?vCInv(top,wireTop):sub==='po'?vPO(top,wireTop):sub==='cover'?vCover(top,wireTop):vMatchRec(sub==='maint',top,wireTop); })
    .catch(e=>{ $('#main').innerHTML=top+`<div class="err">${esc(e.message)}</div>`; wireTop(); });
}

// ---------- «أوامر الشراء والاعتمادات»: a tab of المطابقة والصرف (the owner, 31/10) ----------
// One row per purchase order, both sections in one table with a «القسم» filter. The count and the value are added up here from
// the matching rows carrying the same PO, and the value with VAT is that × 1.15, so they can never drift from the records
// the way the hand-kept workbook did. Only the dates, the approvals and the notes are stored (listPOs / savePOCells).
const PO_VAT=1.15;
const PO_COLS=['sec','po','notice_no','n_wo','net','gross','tax_date','sap_date','appr_head','appr_mgr','appr_fin','notes'];
const PO_L={sec:'القسم',po:'رقم PO',notice_no:'رقم الإشعار',n_wo:'عدد أوامر العمل',net:'القيمة بدون الضريبة',gross:'القيمة بالضريبة',
  tax_date:'تاريخ إصدار الفاتورة الضريبية',sap_date:'موقف الارفاق على الساب',appr_head:'اعتماد رئيس القسم',appr_mgr:'اعتماد مدير الدائرة',appr_fin:'اعتماد المالية',notes:'ملاحظات'};
const PO_ED=['notice_no','tax_date','sap_date','appr_head','appr_mgr','appr_fin','notes'];
const PO_CALC=['n_wo','net','gross'];
const PO_SECL={cons:'الإنشاءات',maint:'الصيانة والطوارئ'};
const poSecOf=o=>mrInv(o)?'maint':'cons';
const poIsNo=x=>/^\d{5,}$/.test(String(x==null?'':x).replace(/\s/g,''));   // a real PO number, not «تحت الاعداد» or «جاري المطابقه»
const poRound=n=>Math.round((+n||0)*100)/100;
// every PO (and every bucket such as «تحت الاعداد») found in the matching records, with its orders counted and its value added up
function poRows(){ const R=S.mr||{rows:[]}, P=S.po||{rows:[]}, M={};
  (P.rows||[]).forEach(r=>{ const sec=r.sec, po=String(r.po||''); if(!sec||!po) return; M[sec+'|'+po]=r; });
  const G={};
  (R.rows||[]).forEach(o=>{ const sec=poSecOf(o), po=String(o.po==null?'':o.po).trim()||String(o.po_status==null?'':o.po_status).trim(); if(!po) return;
    const k=sec+'|'+po, g=G[k]||(G[k]={sec,po,n_wo:0,net:0,bucket:!poIsNo(po)});
    g.n_wo++; const v=mrNum(mrInv(o)?o.inv_net:o.value); if(v!=null) g.net+=v; });
  // a stored row whose PO no longer appears in the records still shows, so nothing typed is ever lost from sight
  Object.keys(M).forEach(k=>{ if(!G[k]){ const r=M[k]; G[k]={sec:r.sec,po:r.po,n_wo:0,net:0,bucket:!poIsNo(r.po)}; } });
  return Object.keys(G).map(k=>{ const g=G[k], m=M[k]||{};
    return Object.assign({key:k,n_wo:g.n_wo,net:poRound(g.net),gross:poRound(g.net*PO_VAT),bucket:g.bucket},
      {sec:g.sec,po:g.po},PO_ED.reduce((a,c)=>(a[c]=m[c]||'',a),{}),{updated_at:m.updated_at||'',updated_by:m.updated_by||''}); })
    .sort((a,b)=>(a.sec===b.sec?0:a.sec==='cons'?-1:1)||(a.bucket-b.bucket)||String(a.po).localeCompare(String(b.po),'ar'));
}
const poDate=v=>/^\d{4}-\d{2}-\d{2}/.test(String(v||''));
// 🔴 the tax invoice was issued before SAP approved · 🟢 still waiting on SAP
const poRed=o=>poDate(o.tax_date)&&!poDate(o.sap_date);
const poGreen=o=>!poRed(o)&&!poDate(o.sap_date)&&(o.n_wo>0||o.notice_no||o.notes);
async function poLoad(force){ if(S.po&&!force) return S.po; S.po=await api('listPOs',S.tok); return S.po; }
function poName(k){ const P=S.po||{}; return (k==='appr_head'?P.head:k==='appr_mgr'?P.mgr:P.fin)||''; }
function vPO(top,wireTop){

  const lbl=k=>{ const n=PO_ED.indexOf(k)>=0&&/^appr_/.test(k)?poName(k):''; return PO_L[k]+(n?' ('+n+')':''); };
  const AD={ noImp:1, st:ST, unit:'أمر شراء', stk:'po', file:'أوامر_الشراء', sub:'po', subName:'أوامر الشراء والاعتمادات', orders:false,
    all:PO_COLS.concat(['updated_at','updated_by']), lbl, val:(o,k)=>k==='sec'?(PO_SECL[o.sec]||o.sec):(o[k]==null?'':o[k]),
    can:(o,k)=>can&&PO_ED.includes(k), opts:(o,k)=>k==='sec'?Object.values(PO_SECL):k==='sap_date'||k==='appr_head'||k==='appr_mgr'||k==='appr_fin'?['تحت الاعتماد','تحت الاعتماد ع الساب']:undefined,
    dates:['tax_date'], wrap:['notes'], free:PO_ED,
    src:()=>'أوامر الشراء', clr:()=>tc, chip:()=>'',
    cls:(o,k)=>poRed(o)?'late':'',
    cell:(o,k,v)=>k==='po'&&o.bucket?`<span class="pill p-w" title="ليست أمر شراء — مجموعة أوامر بهذا الموقف">${esc(v)}</span>`
      :k==='net'||k==='gross'?(v===''||v==null?'':gFmt(+v))
      :k==='sap_date'&&poRed(o)?`<span class="pill p-d" title="صدرت الفاتورة الضريبية قبل اعتماد الساب">${esc(v||'لم يُرفع')}</span>`:esc(v==null?'':v),

      const P=S.po; (r.rows||[]).forEach(x=>{ const i=(P.rows||[]).findIndex(y=>y.key===x.key); if(i>=0) P.rows[i]=x; else (P.rows=P.rows||[]).push(x); }); }),
    bar:S.B.admin?'<button id="ponm">أسماء المعتمدين</button>':'',
    help:'صف لكل أمر شراء في القسمين. «عدد أوامر العمل» و«القيمة بدون الضريبة» مجموعة تلقائياً من سجلات المطابقة التي تحمل نفس رقم PO، و«القيمة بالضريبة» = القيمة × 1.15 — لا تُكتب ولا تختلف عن السجلات. الباقي يُكتب هنا. الأحمر: صدرت الفاتورة الضريبية قبل اعتماد الساب. الأخضر: ما زال تحت الاعتماد على الساب. الصفوف المعلَّمة مثل «تحت الاعداد» ليست أوامر شراء بل مجموعات أوامر بهذا الموقف.',

// SheetJS builds dates from 30-12-1899 in local time; Riyadh was +3:06:52 then, so every date came out 6m52s early (23:53 the day before). Put them back on their day.
function xlFixDates(wb){ const base=new Date(1899,11,30), bOff=Date.UTC(1899,11,30)-base.getTime();
  Object.values((wb&&wb.Sheets)||{}).forEach(ws=>Object.keys(ws).forEach(a=>{ if(a[0]==='!') return; const c=ws[a]; if(c&&c.t==='d'&&c.v instanceof Date&&!isNaN(c.v)){ const fix=bOff+c.v.getTimezoneOffset()*60000; if(fix) c.v=new Date(c.v.getTime()+fix); } })); return wb; }
function xlWrap(){ if(window.XLSX&&!XLSX.__fx&&XLSX.read){ const r0=XLSX.read; XLSX.read=(d,o)=>xlFixDates(r0(d,o)); XLSX.__fx=1; } }
function loadXlsx(){ return window.XLSX?Promise.resolve(xlWrap()):new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https:\/\/cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=()=>{ xlWrap(); ok(); }; s.onerror=()=>no(new Error('تعذّر تحميل قارئ Excel، تحقق من الإنترنت')); document.head.appendChild(s); }); }
