<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button:disabled{opacity:.5}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#bbb}.dot.on{background:#7ed321}.dot.off{background:#ff6b6b}
.wrap{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.muted{color:var(--mut);font-size:13px}.err{color:var(--dan);font-size:13px;margin-top:6px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:#eef1f5}.p-ok{background:var(--okbg);color:var(--ok)}.p-w{background:var(--warnbg);color:var(--warn)}.p-d{background:var(--danbg);color:var(--dan)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs button.on{background:var(--pri);color:#fff}
.item{display:block;width:100%;text-align:right}.item .t{font-weight:700}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}.f .full{grid-column:1/-1}
@media (max-width:520px){.f{grid-template-columns:1fr}}
h3{margin:12px 0 6px;font-size:16px}

.th .loc{outline:2px dashed var(--warn)}
.cam{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:20px;background:#fff;cursor:pointer}
.qi{padding:10px 0;border-top:1px solid var(--line)}.qi .tx{font-size:15px}.qi small{display:block;color:var(--mut);direction:ltr;text-align:left;font-size:11px}
.ab{display:flex;gap:6px;margin-top:8px}.ab button{flex:1;padding:12px 4px;font-size:15px}.ab .on.y{background:var(--ok);color:#fff;border-color:var(--ok)}.ab .on.n{background:var(--dan);color:#fff;border-color:var(--dan)}.ab .on.x{background:#777;color:#fff;border-color:#777}
.qh{background:#eef3f8;padding:7px 10px;border-radius:8px;font-weight:700;margin-top:10px}
.sticky{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:6px 0;display:flex;gap:8px;align-items:center}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:50;max-width:90%;text-align:center}

.big{font-size:17px;padding:12px}

<body>
<div id="app"></div><div id="toast"></div>
<script>
const API_DEFAULT = '';   // رابط البرنامج الذي ينتهي بـ /exec (اختياري: يمكن كتابته عند أول فتح)
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const S = { api: '', dev: '', user: null, B: null, Q: [], r: { v: 'home' }, tab: 'o', q: '', syncing: false, msg: '' };
const toast = (t, ms) => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', ms || 2600); };
const now = () => { const d = new Date(), p = n => ('0' + n).slice(-2); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const today = () => now().slice(0, 10), hm = () => now().slice(11, 16);
const phUrl = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 200);

// ---------- storage (IndexedDB): kv = settings and the downloaded data, q = work waiting to be sent ----------
const DB = { db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, no) => { const r = indexedDB.open('aji-field', 1); r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('q', { keyPath: 'id', autoIncrement: true }); }; r.onsuccess = () => { this.db = r.result; ok(this.db); }; r.onerror = () => no(r.error); }); },
  async tx(st, mode, f) { const d = await this.open(); return new Promise((ok, no) => { const t = d.transaction(st, mode), s = t.objectStore(st); let res; const q = f(s); if (q) q.onsuccess = () => res = q.result; t.oncomplete = () => ok(res); t.onerror = () => no(t.error); }); },
  get(k) { return this.tx('kv', 'readonly', s => s.get(k)); }, set(k, v) { return this.tx('kv', 'readwrite', s => s.put(v, k)); }, delk(k) { return this.tx('kv', 'readwrite', s => s.delete(k)); },
  qall() { return this.tx('q', 'readonly', s => s.getAll()); }, qadd(o) { return this.tx('q', 'readwrite', s => s.add(o)); }, qput(o) { return this.tx('q', 'readwrite', s => s.put(o)); }, qdel(id) { return this.tx('q', 'readwrite', s => s.delete(id)); }
};
// a new choice (network / equipment / work kind) replaces the same unsent choice, so ticking many boxes stays one item
const SAME = (a, b) => a.t === 'qd' && b.t === 'qd' && a.ref === b.ref && !a.sending && ['net', 'eq', 'mw'].some(k => a.op[k] !== undefined && b.op[k] !== undefined) && Object.keys(a.op).length === 1 && Object.keys(b.op).length === 1;
async function enqueue(op) { op.at = now(); const old = S.Q.find(x => SAME(x, op));
  if (old) { old.op = op.op; old.at = op.at; delete old.err; await DB.qput(old); } else { op.id = await DB.qadd(op); S.Q.push(op); }
  render(); clearTimeout(enqueue.h); enqueue.h = setTimeout(sync, 1500); }

// ---------- server ----------
async function call(fn, ...args) {
  let r; const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 90000); try { r = await fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args, dev: S.dev }), redirect: 'follow', signal: ac.signal }); clearTimeout(tm); }
  catch (e) { const er = new Error('لا يوجد اتصال بالإنترنت'); er.net = 1; throw er; }
  if (!r.ok) { const er = new Error('الخادم غير متاح (' + r.status + ')'); er.net = 1; throw er; }
  let j; try { j = await r.json(); } catch (e) { const er = new Error('رد غير متوقع من الخادم. تأكد من رابط البرنامج'); er.net = 1; throw er; }
  if (j.err) { if (/انتهت الجلسة/.test(j.err)) { S.dev = ''; await DB.delk('dev'); } throw new Error(j.err); }
  return j.ok;
}
async function pull() { const B = await call('fieldPull'); S.B = B; await DB.set('B', B); return B; }
async function runOp(op) {
  if (op.t === 'qd') return call('qdSave', op.ref, op.op);
  if (op.t === 'up') return call('qdUpload', op.ref, op.slot, op.b64, op.mime, op.loc || '');
  if (op.t === 'del') return call('qdRemove', op.ref, op.slot, op.fid);
  if (op.t === 'form') {
    op.done = op.done || [];
    for (let i = op.done.length; i < op.photos.length; i++) { const p = op.photos[i]; const r = await call('uploadFormPhoto', op.ref, op.kind, p.b64, p.mime, p.loc || ''); op.done.push({ id: r.id, name: r.name, st: r.st, loc: r.loc }); await DB.qput(op); }
    return call('saveForm', { kind: op.kind, wo: op.ref, data: op.data, photos: op.done });
  }
}
async function sync(manual) {
  if (S.syncing || !S.dev) return; if (!navigator.onLine && !manual) return render();
  S.syncing = true; render(); let sent = 0, failed = 0; const tried = new Set();
  try {
    let op;
    while ((op = S.Q.find(x => !tried.has(x.id)))) {
      tried.add(op.id); op.sending = 1;
      try { await runOp(op); await DB.qdel(op.id); S.Q = S.Q.filter(x => x.id !== op.id); sent++; render(); }
      catch (e) { delete op.sending; if (e.net) throw e; op.err = e.message; failed++; await DB.qput(op); }
    }
    await pull(); if (!S.noFull && (manual || !S.F || Date.now() - (S.F.got || 0) > 300000)) await pullFull(); S.msg = 'آخر مزامنة ' + now();
    if (sent || failed) toast('أُرسل ' + sent + (failed ? ' — ' + failed + ' لم يُقبل (افتح «بانتظار الإرسال»)' : ''), failed ? 5000 : 2600);
  } catch (e) { S.msg = e.message; if (manual) toast(e.message, 4000); }
  S.Q.forEach(x => delete x.sending); S.syncing = false; render();
}
addEventListener('online', () => { render(); sync(); }); addEventListener('offline', render);
setInterval(() => { if (S.Q.length && navigator.onLine) sync(); }, 60000);

// ---------- the local copy of an order's quality documents = downloaded data + work not sent yet ----------
const me = () => (S.user || {}).name || '';
function itemOf(key) {
  if (/^D9:/.test(key)) { const n = (S.B.notices || []).find(x => 'D9:' + x.d9 === key); if (!n) return null; return { key, d9: 1, type: 'D9', wo: n.d9, office: n.office, contractor: n.contractor, district: n.station, station: n.station, site_engineer: me(), work_desc: n.work_desc, status: n.status, qf_status: n.qf_status }; }
  const o = (S.B.orders || []).find(x => x.key === key); return o ? Object.assign({ d9: 0 }, o) : null;
}
function applyOp(d, op) {
  const C = S.B.cat;
  if (op.t === 'qd') { const o = op.op;
    if (o.net !== undefined) d.net = o.net; if (o.eq) d.eq = o.eq; if (o.mw) d.mw = o.mw;
    if (o.add) { d.add = [...new Set((d.add || []).concat([o.add]))]; d.drop = (d.drop || []).filter(k => k !== o.add); }
    if (o.drop) { d.drop = [...new Set((d.drop || []).concat([o.drop]))]; d.add = (d.add || []).filter(k => k !== o.drop); }
    if (o.form) { d.f = d.f || {}; d.f[o.form.code] = { a: o.form.a, nt: o.form.nt, rm: o.form.rm, hdr: o.form.hdr, by: me(), at: op.at, local: 1 }; d.rej = (d.rej || []).filter(x => x.s !== 'f:' + o.form.code); } }
  if (op.t === 'up') { const it = { id: 'L' + op.id, local: 1, thumb: op.thumb, mime: op.mime, by: me() }; const m = op.slot.match(/^p:(.+)$/), u = op.slot.match(/^u:(.+)$/);
    if (m) { d.ph = d.ph || {}; (d.ph[m[1]] = d.ph[m[1]] || []).push(it); } else if (u) { d.up = d.up || {}; (d.up[u[1]] = d.up[u[1]] || []).push(it); } d.rej = (d.rej || []).filter(x => x.s !== op.slot); }
  if (op.t === 'del') { const m = op.slot.match(/^p:(.+)$/), u = op.slot.match(/^u:(.+)$/); const take = a => (a || []).filter(x => x.id !== op.fid);
    if (m && d.ph) d.ph[m[1]] = take(d.ph[m[1]]); if (u && d.up) d.up[u[1]] = take(d.up[u[1]]); }
  return d;
}
function docOf(key) { const base = JSON.parse(JSON.stringify(((S.B.qd || {})[key] || {}).d || {})); S.Q.filter(op => op.ref === key && op.t !== 'form').forEach(op => applyOp(base, op)); return base; }
const uq = a => a.filter((x, i) => a.indexOf(x) === i);
function guessMw(t) { t = String(t || ''); if (/(mini ?pil|pillar|بيلر|بلر|مني|ميني|لوحة توزيع)/i.test(t)) return 'MPR'; if (/(cable|joint|termin|fault|كابل|كيبل|جوينت|ترمن|عطل)/i.test(t)) return 'CF'; return 'GEN'; }
function planOf(it, d) {
  const C = S.B.cat; let mx = C.mx[it.d9 ? 'D9' : String(it.type)] || C.mx['*'], net = '', needNet = false; const hasNet = !!mx.g;
  if (hasNet) { net = d.net || mx.net || ''; const g = mx.g, o = mx.o; if (net === 'g') mx = g; else if (net === 'o') mx = o; else if (net === 'b') mx = { req: uq(g.req.concat(o.req)), opt: uq(g.opt.concat(o.opt)) }; else { needNet = true; mx = { req: g.req.filter(k => o.req.includes(k)), opt: [] }; } }
  const drop = d.drop || [], add = d.add || [], set = mx.req.filter(k => !drop.includes(k)).concat(add), req = C.order.filter(k => set.includes(k));
  let cats; if (it.d9) cats = [d.mw || guessMw(it.work_desc)]; else if (Array.isArray(d.eq)) cats = C.eq.filter(e => d.eq.includes(e)); else { const s = []; req.forEach(k => (C.eq_of[k] || []).forEach(e => { if (!s.includes(e)) s.push(e); })); cats = C.eq.filter(e => s.includes(e)); }
  return { req, sug: (mx.opt || []).filter(k => !req.includes(k)), net, needNet, hasNet, cats };
}
function formsOf(key) { const L = ((S.B.forms || {})[key] || []).map(x => Object.assign({}, x)); S.Q.filter(op => op.t === 'form' && op.ref === key).forEach(op => L.push({ id: 'L' + op.id, kind: op.kind, seq: '…', local: 1, err: op.err })); return L; }
const nk = s => String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
function licOf(it, d) { const names = uq([it.site_engineer].concat(Object.keys(d.f || {}).map(k => d.f[k].by)).filter(Boolean)); const n = names[0] || ''; if (!n) return { name: '', has: false };
  const k = nk(n), L = (S.B.lic || []).map(nk); return { name: n, has: L.some(x => x === k || x.split(' ').slice(0, 2).join(' ') === k.split(' ').slice(0, 2).join(' ')) }; }
function stateOf(it, d, P) {
  const C = S.B.cat, st = {}, F = formsOf(it.key), lic = licOf(it, d); let fd = 0, pd = 0, pn = 0, miss = 0;
  P.req.forEach(k => { const f = C.forms[k]; let s = 'none';
    if (f.k === 'chk') { const a = ((d.f || {})[k] || {}).a || {}, n = f.items.filter(x => !x.h).length, m = Object.keys(a).filter(i => a[i]).length; s = m >= n ? 'done' : m ? 'part' : 'none'; }
    else if (f.k === 'up') s = ((d.up || {})[k] || []).length ? 'done' : 'none';
    else if (f.k === 'site' || f.k === 'meeting') s = F.some(x => x.kind === f.k) ? 'done' : 'none';
    else if (f.k === 'lic') s = lic.has ? 'done' : 'none';
    st[k] = s; if (s === 'done') fd++; else miss++; });
  P.cats.forEach(g => { const G = C.ph[g]; if (G) G.items.forEach((t, i) => { pn++; if (((d.ph || {})[g + ':' + i] || []).length) pd++; else miss++; }); });
  return { st, lic, prog: fd + '/' + P.req.length + ' · ' + pd + '/' + pn, miss };
}

// ---------- photos: shrink, stamp (time, location, order, engineer, logo) ----------
function getLoc() { return new Promise((ok, no) => { if (!navigator.geolocation) return no(new Error('الجهاز لا يدعم تحديد الموقع')); const tm = setTimeout(() => no(new Error('لم يصل الموقع (GPS)')), 30000);
  navigator.geolocation.getCurrentPosition(p => { clearTimeout(tm); ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); }, e => { clearTimeout(tm); no(new Error(e && e.code === 1 ? 'لم يُسمح بالموقع للتطبيق' : 'تعذّر تحديد الموقع')); }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 30000 }); }); }
const loadImg = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('تعذّر قراءة الصورة')); im.src = src; });
async function shrink(file, max, q) { const url = URL.createObjectURL(file); try { const im = await loadImg(url); const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); return c; } finally { URL.revokeObjectURL(url); } }
async function stamp(cv, it, locP) {
  let loc = null; try { loc = await locP; } catch (e) { if (S.B.project && S.B.project.loc && !confirm(e.message + '\nرفع الصورة بلا موقع؟')) throw new Error('أُلغيت الصورة'); }
  const W = cv.width, H = cv.height, m = Math.min(W, H), pad = Math.max(6, Math.round(m * 0.025)), g = cv.getContext('2d'), ltr = t => '‪' + t + '‬';
  const lines = [[ltr(now()), 'المهندس: ' + me()].join(' · '), (it.d9 ? 'إشعار D9 ' + ltr(it.wo) : 'أمر العمل ' + ltr(it.wo) + (it.type ? ' · النوع ' + ltr(it.type) : '')) + (it.district ? ' · ' + it.district : ''), 'الموقع: ' + (loc ? ltr(loc.lat.toFixed(6) + ', ' + loc.lng.toFixed(6)) + (loc.acc ? ' (±' + Math.round(loc.acc) + ' م)' : '') : 'غير متاح')];
  let fs = Math.max(12, Math.round(W / 40)); const font = () => g.font = '600 ' + fs + 'px Tahoma, Arial, sans-serif'; font(); while (fs > 10 && Math.max(...lines.map(t => g.measureText(t).width)) > W - 2 * pad) { fs--; font(); }
  const lh = Math.round(fs * 1.5), sh = lh * lines.length + pad, oc = document.createElement('canvas'); oc.width = W; oc.height = H + sh; const q = oc.getContext('2d'); q.drawImage(cv, 0, 0); q.fillStyle = '#1f2d3d'; q.fillRect(0, H, W, sh);
  q.font = g.font; q.fillStyle = '#fff'; q.textBaseline = 'middle'; q.direction = 'rtl'; q.textAlign = 'right'; lines.forEach((t, i) => q.fillText(t, W - pad, H + pad / 2 + lh * i + lh / 2, W - 2 * pad));
  if (S.B.stampLogo) { try { const lg = await loadImg(S.B.stampLogo), L = Math.max(40, Math.round(m * 0.16)); q.drawImage(lg, pad, pad, L, L); } catch (e) {} }
  return { cv: oc, loc: loc ? loc.lat.toFixed(7) + ',' + loc.lng.toFixed(7) : '' };
}
const thumbOf = cv => { const s = Math.min(1, 200 / Math.max(cv.width, cv.height)), c = document.createElement('canvas'); c.width = Math.round(cv.width * s); c.height = Math.round(cv.height * s); c.getContext('2d').drawImage(cv, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.6); };
async function takePhotos(files, it, cam) { const out = []; const locP = cam ? getLoc() : null; if (locP) locP.catch(() => {});
  for (const f of files) { let cv = await shrink(f, 1600, 0.75), loc = ''; if (cam) { toast('جارٍ ختم الصورة بالموقع…'); const r = await stamp(cv, it, locP); cv = r.cv; loc = r.loc; }

    <div class="muted" style="margin-bottom:6px">${L.length} سجلاً</div>

    ${L.length > n ? '<button id="more" style="width:100%;margin-bottom:20px">عرض المزيد</button>' : ''}</div>`;
  wire();
  $$('[data-sec]').forEach(b => b.onclick = () => { S.r = { v: 'full', sec: b.dataset.sec }; history.replaceState(S.r, ''); render(); });
  $$('[data-qf]').forEach(b => b.onclick = () => { S.r = Object.assign({}, r, { f: b.dataset.qf, n: 60 }); history.replaceState(S.r, ''); render(); });
  $('#fq').oninput = e => { r.q = e.target.value; r.n = 60; const p = e.target.selectionStart; render(); const i = $('#fq'); i.focus(); i.setSelectionRange(p, p); };

function recView(A) {
  const F = S.F, r = S.r, sec = r.sec, x = F && secRows(sec, r.f)[r.i]; if (!x) { history.back(); return; }
  const isO = sec === 'orders' || sec === 'quality', LB = isO ? LBL : sec === 'maint' ? ML : sec === 'permits' ? PL : {};

  const skip = ['salt', 'hash', 'folder_id', 'qf_id', 'key', 'open', 'exec', 'needsQF', 'data', 'photos'];
  const keys = sec === 'olap' ? F.LH : Object.keys(x).filter(k => !skip.includes(k));
  const val = (k, v) => /^https?:/.test(String(v)) ? `<a href="${esc(v)}" target="_blank" rel="noopener">فتح</a>` : esc(v);
  const title = isO ? x.wo + (x.ccode ? '-' + x.ccode : '') : sec === 'maint' ? 'D9 ' + x.d9 : sec === 'permits' ? 'طلب ' + (x.req_no || x.id) : sec === 'forms' ? (FK[x.kind] || x.kind) + ' ' + x.seq : String(x[F.LH[0]] || '');
  const review = isO && x.qf_status === 'بانتظار الجودة' && F.b.qe;
  A.innerHTML = topBar(title, 1) + `<div class="wrap">
    ${isO && x.qf_url ? `<a class="card item" href="${esc(x.qf_url)}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:inherit">📄 فتح ملف الجودة (${esc(x.qf_status || '')})</a>` : ''}
    ${review ? '<button class="pri big" id="rv" style="width:100%;margin-bottom:10px">✔ مراجعة ملف الجودة: اعتماد أو رفض</button>' : ''}
    ${(() => { const row = k => `<div class="fl"><div class="n"><div class="muted">${esc(LB[k] || k)}</div><div>${val(k, x[k])}</div></div>${canEd(k) ? `<button data-ed="${esc(k)}" style="padding:6px 10px">✎</button>` : ''}</div>`, full = keys.filter(k => x[k] !== '' && x[k] != null), empty = keys.filter(k => !(x[k] !== '' && x[k] != null) && canEd(k));
      return `<div class="card">${full.map(row).join('')}</div>${empty.length ? `<details class="card"><summary class="muted">حقول فارغة يمكن تعبئتها (${empty.length})</summary>${empty.map(row).join('')}</details>` : ''}`; })()}
    ${isO ? '<div class="muted" style="margin-bottom:20px">التعديل يُحفظ مباشرة في البرنامج ويحتاج اتصالاً بالإنترنت.</div>' : ''}</div>`;

    box.innerHTML = `<div class="n"><div class="muted">${esc(LB[k] || k)}</div>${opts ? `<select id="ev"><option></option>${opts.map(o => `<option ${o === x[k] ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` : `<input id="ev" value="${esc(x[k])}" ${/date/.test(k) ? 'type="date"' : ''}>`}</div><button class="pri" id="es">حفظ</button>`;
    $('#es').onclick = async () => { const v = $('#ev').value.trim(); $('#es').disabled = true;
      try { await call('saveCells', [{ wo: x.key, k, v }]); x[k] = v; if (k === 'cur_stage') { const p = F.pct[v] ?? 0; x.open = p < 100; x.exec = p < 90; x.needsQF = (F.pct['تم التنفيذ'] || 0) > 0 && p >= (F.pct['تم التنفيذ'] || 0); }
        const raw = F.orders, ri = raw.rows.findIndex(rr => (rr[raw.headers.indexOf('ccode')] ? rr[raw.headers.indexOf('wo')] + '-' + rr[raw.headers.indexOf('ccode')] : String(rr[raw.headers.indexOf('wo')])) === x.key);
        if (ri >= 0 && raw.headers.indexOf(k) >= 0) raw.rows[ri][raw.headers.indexOf(k)] = v; await DB.set('F', F); toast('حُفظ'); render(); }
      catch (e) { toast(e.message, 4000); $('#es').disabled = false; } };

}
async function reviewView(A) {
  const key = S.r.key, o = (S.F.O || []).find(x => x.key === key);
  A.innerHTML = topBar('مراجعة ' + (o ? o.wo : ''), 1) + '<div class="wrap"><div class="card muted">جارٍ تحميل الملف…</div></div>'; wire();
  if (!navigator.onLine) { $('.wrap').innerHTML = '<div class="card muted">المراجعة تحتاج اتصالاً بالإنترنت.</div>'; return; }
  let V; try { V = await call('qdGet', key); } catch (e) { $('.wrap').innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  if (S.r.v !== 'review') return; const C = S.B.cat, P = V.plan, items = [];
  P.req.forEach(k => { const f = C.forms[k]; if (!f || f.k === 'lic') return; items.push([(f.k === 'chk' ? 'f:' : f.k === 'up' ? 'u:' : 'fm:') + (f.k === 'site' ? 'SITE' : f.k === 'meeting' ? 'MTG' : k), f.name + ((V.st || {})[k] && V.st[k] !== 'done' ? ' (ناقص)' : '')]); });
  P.cats.forEach(g => { const G = C.ph[g]; if (G) G.items.forEach((t, i) => items.push(['p:' + g + ':' + i, G.name + ': ' + t])); });
  $('.wrap').innerHTML = `${o && o.qf_url ? `<a class="card item" href="${esc(o.qf_url)}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:inherit">📄 فتح ملف الجودة PDF</a>` : ''}
    <div class="card"><b>اعتماد</b><div class="muted">إن كان الملف سليماً.</div><button class="pri big" id="ap" style="width:100%;margin-top:8px">اعتماد الملف</button></div>
    <div class="card"><b>رفض</b><div class="muted">حدد ما يحتاج تصحيحاً، ويعود كل بند لمن عبّأه أو صوّره.</div>
      ${items.map(([s, t]) => `<label class="fl" style="cursor:pointer"><input type="checkbox" data-rj="${esc(s)}" style="width:auto"><span class="n">${esc(t)}</span></label>`).join('')}
      <textarea id="rn" rows="3" placeholder="سبب الرفض" style="margin-top:8px"></textarea><button class="big" id="rj" style="width:100%;margin-top:8px;color:var(--dan)">رفض البنود المحددة</button></div>`;
  const done = async (action) => { const its = $$('[data-rj]:checked').map(e => e.dataset.rj), note = $('#rn').value.trim();
    if (action === 'reject' && (!its.length || !note)) return toast('حدد البنود واكتب السبب');
    try { await call('qdReview', key, action, its, note); if (o) o.qf_status = action === 'approve' ? 'معتمد' : 'مرفوض'; toast(action === 'approve' ? 'اعتُمد الملف' : 'رُفضت البنود وأُعيدت لأصحابها'); history.back(); if (navigator.onLine) pullFull().then(render).catch(() => {}); }
    catch (e) { toast(e.message, 4000); } };
  $('#ap').onclick = () => done('approve'); $('#rj').onclick = () => done('reject');
}
