<style>

.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
.top b{font-size:16px}.top .sp{flex:1}.top .webb{color:#14263F;background:#FFD400;border-radius:10px;padding:6px 10px;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}.top button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25);padding:6px 10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#bbb}.dot.on{background:#7ed321}.dot.off{background:#ff6b6b}

.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:#eef1f5}.p-ok{background:var(--okbg);color:var(--ok)}.p-w{background:var(--warnbg);color:var(--warn)}.p-d{background:var(--danbg);color:var(--dan)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs button.on{background:var(--pri);color:#fff}

.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th span{position:relative}.th img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.th .x{position:absolute;top:-7px;left:-7px;background:#fff;color:var(--dan);border-radius:50%;padding:0 5px;font-weight:700;cursor:pointer;border:1px solid var(--line)}

.qi{padding:10px 0;border-top:1px solid var(--line)}.qi .tx{font-size:15px}.qi small{display:block;color:var(--mut);direction:ltr;text-align:left;font-size:11px}
.ab{display:flex;gap:6px;margin-top:8px}.ab button{flex:1;padding:12px 4px;font-size:15px}.ab .on.y{background:var(--ok);color:#fff;border-color:var(--ok)}.ab .on.n{background:var(--dan);color:#fff;border-color:var(--dan)}.ab .on.x{background:#777;color:#fff;border-color:#777}
.qh{background:#eef3f8;padding:7px 10px;border-radius:8px;font-weight:700;margin-top:10px}

.wrap.wide{max-width:none}.fgw{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line,#e4e2da);border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}.fg{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}.fg th,.fg td{white-space:nowrap;padding:7px 9px;border-bottom:1px solid #eee;border-left:1px solid #f1f1f1;text-align:right}.fg thead th{position:sticky;top:0;z-index:2;font-weight:700}.fg th.st{z-index:3}.fg .st{position:sticky;right:0;background:#fff;z-index:1;font-weight:700;box-shadow:-1px 0 0 #e4e2da}.fg thead .st{z-index:3}.fg tbody tr:active td{background:#FFF8D6}.fgb{display:inline-block;margin-right:6px;padding:0 5px;border:1px solid currentColor;border-radius:4px;font-size:11px;cursor:pointer;opacity:.75}.fgb.on{background:#185FA5;color:#fff!important;border-color:#185FA5;opacity:1}.fgm{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end}.fgm-b{background:#fff;width:100%;max-height:78vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}.fgm #gml label{display:flex;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid #f2f2f2}.fgm #gml label span:nth-child(2){flex:1}.fgm #gml input{width:auto}

body.mopen .scrim{opacity:1;pointer-events:auto}body.mopen .drw{transform:none}
.drw .dh{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:flex-start;gap:8px}.drw .dh small{display:block;opacity:.8;font-size:12px}.drw .dh button{margin-right:auto;background:transparent;border:0;color:#fff;font-size:20px;padding:0 4px}
.drw .dn{flex:1;overflow:auto;padding:6px 8px}.drw .grp{font-size:12px;color:var(--mut);font-weight:700;padding:12px 10px 4px}

<body>
<div id="app"></div><div id="toast"></div>
<script>
const API_DEFAULT = '';   // رابط البرنامج الذي ينتهي بـ /exec (اختياري: يمكن كتابته عند أول فتح)
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const S = { api: '', dev: '', user: null, B: null, Q: [], r: { v: 'home' }, tab: 'o', q: '', syncing: false, msg: '' };
const toast = (t, ms) => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', ms || 2600); };
const now = () => { const d = new Date(), p = n => ('0' + n).slice(-2); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const today = () => now().slice(0, 10), hm = () => now().slice(11, 16);
const phUrl = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 200);

// ---------- storage (IndexedDB): kv = settings and the downloaded data, q = work waiting to be sent ----------
const DB = { db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, no) => { const r = indexedDB.open('aji-field', 1); r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('q', { keyPath: 'id', autoIncrement: true }); }; r.onsuccess = () => { this.db = r.result; ok(this.db); }; r.onerror = () => no(r.error); }); },
  async tx(st, mode, f) { const d = await this.open(); return new Promise((ok, no) => { const t = d.transaction(st, mode), s = t.objectStore(st); let res; const q = f(s); if (q) q.onsuccess = () => res = q.result; t.oncomplete = () => ok(res); t.onerror = () => no(t.error); }); },
  get(k) { return this.tx('kv', 'readonly', s => s.get(k)); }, set(k, v) { return this.tx('kv', 'readwrite', s => s.put(v, k)); }, delk(k) { return this.tx('kv', 'readwrite', s => s.delete(k)); },
  qall() { return this.tx('q', 'readonly', s => s.getAll()); }, qadd(o) { return this.tx('q', 'readwrite', s => s.add(o)); }, qput(o) { return this.tx('q', 'readwrite', s => s.put(o)); }, qdel(id) { return this.tx('q', 'readwrite', s => s.delete(id)); }
};
// a new choice (network / equipment / work kind) replaces the same unsent choice, so ticking many boxes stays one item
const SAME = (a, b) => (a.t === 'boq' || a.t === 'draw') ? a.t === b.t && a.ref === b.ref && !a.sending : a.t === 'qd' && b.t === 'qd' && a.ref === b.ref && !a.sending && ['net', 'eq', 'mw'].some(k => a.op[k] !== undefined && b.op[k] !== undefined) && Object.keys(a.op).length === 1 && Object.keys(b.op).length === 1;
async function enqueue(op) { op.at = now(); const old = S.Q.find(x => SAME(x, op));
  if (old) { Object.assign(old, op, { id: old.id }); delete old.err; await DB.qput(old); } else { op.id = await DB.qadd(op); S.Q.push(op); }
  render(); clearTimeout(enqueue.h); enqueue.h = setTimeout(sync, 1500); }

// ---------- server ----------
async function call(fn, ...args) {
  let r; const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 90000); try { r = await fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args, dev: S.dev }), redirect: 'follow', signal: ac.signal }); clearTimeout(tm); }
  catch (e) { const er = new Error('لا يوجد اتصال بالإنترنت'); er.net = 1; throw er; }
  if (!r.ok) { const er = new Error('الخادم غير متاح (' + r.status + ')'); er.net = 1; throw er; }
  let j; try { j = await r.json(); } catch (e) { const er = new Error('رد غير متوقع من الخادم. تأكد من رابط البرنامج'); er.net = 1; throw er; }
  if (j.err) { if (/انتهت الجلسة/.test(j.err)) { S.dev = ''; await DB.delk('dev'); } throw new Error(j.err); }
  return j.ok;
}
async function pull() { const B = await call('fieldPull', S.itv || ''); if (B.items) { S.IT = {}; B.items.forEach(x => S.IT[x[0]] = [x[1], x[2]]); S.itv = B.itemsVer; await DB.set('items', { v: S.itv, m: S.IT }); } delete B.items; S.B = B; await DB.set('B', B); return B; }
async function runOp(op) {
  if (op.t === 'qd') return call('qdSave', op.ref, op.op);
  if (op.t === 'up') return call('qdUpload', op.ref, op.slot, op.b64, op.mime, op.loc || '');
  if (op.t === 'del') return call('qdRemove', op.ref, op.slot, op.fid);
  if (op.t === 'boq') return call('boqSave', op.ref, { lines: op.lines });
  if (op.t === 'draw') return call('boqDraw', op.ref, op.draw, op.png || '');
  if (op.t === 'form') {
    op.done = op.done || [];
    for (let i = op.done.length; i < op.photos.length; i++) { const p = op.photos[i]; const r = await call('uploadFormPhoto', op.ref, op.kind, p.b64, p.mime, p.loc || ''); op.done.push({ id: r.id, name: r.name, st: r.st, loc: r.loc }); await DB.qput(op); }
    return call('saveForm', { kind: op.kind, wo: op.ref, data: op.data, photos: op.done });
  }
}
async function sync(manual) {
  if (S.syncing || !S.dev) return; if (!navigator.onLine && !manual) return render();
  S.syncing = true; render(); let sent = 0, failed = 0; const tried = new Set();
  try {
    let op;
    while ((op = S.Q.find(x => !tried.has(x.id)))) {
      tried.add(op.id); op.sending = 1;
      try { await runOp(op); await DB.qdel(op.id); S.Q = S.Q.filter(x => x.id !== op.id); sent++; render(); }
      catch (e) { delete op.sending; if (e.net) throw e; op.err = e.message; failed++; await DB.qput(op); }
    }
    await pull(); if (!S.noFull && (manual || !S.F || Date.now() - (S.F.got || 0) > 300000)) await pullFull(); S.msg = 'آخر مزامنة ' + now();
    if (sent || failed) toast('أُرسل ' + sent + (failed ? ' — ' + failed + ' لم يُقبل (افتح «بانتظار الإرسال»)' : ''), failed ? 5000 : 2600);
  } catch (e) { S.msg = e.message; if (manual) toast(e.message, 4000); }
  S.Q.forEach(x => delete x.sending); S.syncing = false; render();
}
addEventListener('online', () => { render(); sync(); }); addEventListener('offline', render);
setInterval(() => { if (S.Q.length && navigator.onLine) sync(); }, 60000);

// ---------- the local copy of an order's quality documents = downloaded data + work not sent yet ----------
const me = () => (S.user || {}).name || '';
function itemOf(key) {
  if (/^D9:/.test(key)) { const n = (S.B.notices || []).find(x => 'D9:' + x.d9 === key); if (!n) return null; return { key, d9: 1, type: 'D9', wo: n.d9, office: n.office, contractor: n.contractor, district: n.station, station: n.station, site_engineer: me(), work_desc: n.work_desc, status: n.status, qf_status: n.qf_status }; }
  const o = (S.B.orders || []).find(x => x.key === key); return o ? Object.assign({ d9: 0 }, o) : null;
}
function applyOp(d, op) {
  const C = S.B.cat;
  if (op.t === 'qd') { const o = op.op;
    if (o.net !== undefined) d.net = o.net; if (o.eq) d.eq = o.eq; if (o.mw) d.mw = o.mw;
    if (o.add) { d.add = [...new Set((d.add || []).concat([o.add]))]; d.drop = (d.drop || []).filter(k => k !== o.add); }
    if (o.drop) { d.drop = [...new Set((d.drop || []).concat([o.drop]))]; d.add = (d.add || []).filter(k => k !== o.drop); }
    if (o.form) { d.f = d.f || {}; d.f[o.form.code] = { a: o.form.a, nt: o.form.nt, rm: o.form.rm, hdr: o.form.hdr, by: me(), at: op.at, local: 1 }; d.rej = (d.rej || []).filter(x => x.s !== 'f:' + o.form.code); } }
  if (op.t === 'up') { const it = { id: 'L' + op.id, local: 1, thumb: op.thumb, mime: op.mime, by: me() }; const m = op.slot.match(/^p:(.+)$/), u = op.slot.match(/^u:(.+)$/);
    if (m) { d.ph = d.ph || {}; (d.ph[m[1]] = d.ph[m[1]] || []).push(it); } else if (u) { d.up = d.up || {}; (d.up[u[1]] = d.up[u[1]] || []).push(it); } d.rej = (d.rej || []).filter(x => x.s !== op.slot); }
  if (op.t === 'del') { const m = op.slot.match(/^p:(.+)$/), u = op.slot.match(/^u:(.+)$/); const take = a => (a || []).filter(x => x.id !== op.fid);
    if (m && d.ph) d.ph[m[1]] = take(d.ph[m[1]]); if (u && d.up) d.up[u[1]] = take(d.up[u[1]]); }
  return d;
}
function docOf(key) { const base = JSON.parse(JSON.stringify(((S.B.qd || {})[key] || {}).d || {})); S.Q.filter(op => op.ref === key && op.t !== 'form').forEach(op => applyOp(base, op)); return base; }
const uq = a => a.filter((x, i) => a.indexOf(x) === i);
function guessMw(t) { t = String(t || ''); if (/(mini ?pil|pillar|بيلر|بلر|مني|ميني|لوحة توزيع)/i.test(t)) return 'MPR'; if (/(cable|joint|termin|fault|كابل|كيبل|جوينت|ترمن|عطل)/i.test(t)) return 'CF'; return 'GEN'; }
function planOf(it, d) {
  const C = S.B.cat; let mx = C.mx[it.d9 ? 'D9' : String(it.type)] || C.mx['*'], net = '', needNet = false; const hasNet = !!mx.g;
  if (hasNet) { net = d.net || mx.net || ''; const g = mx.g, o = mx.o; if (net === 'g') mx = g; else if (net === 'o') mx = o; else if (net === 'b') mx = { req: uq(g.req.concat(o.req)), opt: uq(g.opt.concat(o.opt)) }; else { needNet = true; mx = { req: g.req.filter(k => o.req.includes(k)), opt: [] }; } }
  const drop = d.drop || [], add = d.add || [], set = mx.req.filter(k => !drop.includes(k)).concat(add), req = C.order.filter(k => set.includes(k));
  let cats; if (it.d9) cats = [d.mw || guessMw(it.work_desc)]; else if (Array.isArray(d.eq)) cats = C.eq.filter(e => d.eq.includes(e)); else { const s = []; req.forEach(k => (C.eq_of[k] || []).forEach(e => { if (!s.includes(e)) s.push(e); })); cats = C.eq.filter(e => s.includes(e)); }
  return { req, sug: (mx.opt || []).filter(k => !req.includes(k)), net, needNet, hasNet, cats };
}
function formsOf(key) { const L = ((S.B.forms || {})[key] || []).map(x => Object.assign({}, x)); S.Q.filter(op => op.t === 'form' && op.ref === key).forEach(op => L.push({ id: 'L' + op.id, kind: op.kind, seq: '…', local: 1, err: op.err })); return L; }
const nk = s => String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
function licOf(it, d) { const names = uq([it.site_engineer].concat(Object.keys(d.f || {}).map(k => d.f[k].by)).filter(Boolean)); const n = names[0] || ''; if (!n) return { name: '', has: false };
  const k = nk(n), L = (S.B.lic || []).map(nk); return { name: n, has: L.some(x => x === k || x.split(' ').slice(0, 2).join(' ') === k.split(' ').slice(0, 2).join(' ')) }; }
function stateOf(it, d, P) {
  const C = S.B.cat, st = {}, F = formsOf(it.key), lic = licOf(it, d); let fd = 0, pd = 0, pn = 0, miss = 0;
  P.req.forEach(k => { const f = C.forms[k]; let s = 'none';
    if (f.k === 'chk') { const a = ((d.f || {})[k] || {}).a || {}, n = f.items.filter(x => !x.h).length, m = Object.keys(a).filter(i => a[i]).length; s = m >= n ? 'done' : m ? 'part' : 'none'; }
    else if (f.k === 'up') s = ((d.up || {})[k] || []).length ? 'done' : 'none';
    else if (f.k === 'site' || f.k === 'meeting') s = F.some(x => x.kind === f.k) ? 'done' : 'none';
    else if (f.k === 'lic') s = lic.has ? 'done' : 'none';
    st[k] = s; if (s === 'done') fd++; else miss++; });
  P.cats.forEach(g => { const G = C.ph[g]; if (G) G.items.forEach((t, i) => { pn++; if (((d.ph || {})[g + ':' + i] || []).length) pd++; else miss++; }); });
  return { st, lic, prog: fd + '/' + P.req.length + ' · ' + pd + '/' + pn, miss };
}

// ---------- photos: shrink, stamp (time, location, order, engineer, logo) ----------
function getLoc() { return new Promise((ok, no) => { if (!navigator.geolocation) return no(new Error('الجهاز لا يدعم تحديد الموقع')); const tm = setTimeout(() => no(new Error('لم يصل الموقع (GPS)')), 30000);

// ---------- المقايسة on the phone: planned quantities from the office, executed quantities written on site, the site drawing ----------
const UOM = u => ({ M: 'م', M2: 'م²', M3: 'م³', EA: 'عدد', ASM: 'مجموعة', KIT: 'طقم', ST: 'طقم', '%': '%' })[String(u || '').trim().toUpperCase()] || u || '';
const bqDesc = d => String(d || '').replace(/^\s*الاشراف على\s*/, '');
function boqOf(key) { const b = JSON.parse(JSON.stringify(((S.B.boq || {})[key]) || { lines: [], draw: null, draw_id: '', status: '', appr_by: '' }));
  S.Q.forEach(op => { if (op.ref !== key) return; if (op.t === 'boq') { b.lines = JSON.parse(JSON.stringify(op.lines)); b.local = 1; } if (op.t === 'draw') { b.draw = op.draw; b.drawLocal = 1; } }); return b; }

  return `<h3>المقايسة ومخطط الموقع</h3><div class="card"><div class="row"><span class="pill">📋 ${n ? ent + '/' + n + ' بنداً' : 'لا بنود'}</span>${b.status ? `<span class="pill ${b.status === 'فرق' ? 'p-d' : ''}">${esc(b.status)}</span>` : ''}${b.local ? '<span class="pill">⏳ بانتظار الإرسال</span>' : ''}${b.draw || b.draw_id ? `<span class="pill">🗺 مخطط${b.drawLocal ? ' ⏳' : ''}</span>` : ''}</div>
    <div class="row" style="margin-top:8px"><button id="bqo">📋 المقايسة</button><button id="bqd">🗺 مخطط الموقع</button></div></div>`; }
function openDraw(key, after) { const it = itemOf(key), b = boqOf(key);
  if (!S.IT) toast('جدول البنود لم يُنزّل بعد. اتصل بالإنترنت واضغط ⟳ مرة', 4000);
  Sketch.open({ data: b.draw, items: S.IT || {}, ro: !!b.appr_by, meta: { wo: it.wo + (it.type ? '-' + it.type : ''), office: it.office, district: it.district, eng: me(), date: today(), logo: S.B.stampLogo },
    onSave: async (d, png) => { await enqueue({ t: 'draw', ref: key, draw: d, png }); toast('حُفظ المخطط على الجوال' + (navigator.onLine ? '' : ' — يُرسل عند الاتصال')); } }); }
function boqView(A) {
